spring:
  application:
    name: poker-backend
  profiles:
    default: dev
  mongodb:
    # Prefer MONGODB_URI from .env / OS env; falls back to local Mongo.
    uri: ${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/poker}}
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:true}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: always
      group:
        readiness:
          include: readinessState,tournamentMongo
  info:
    env:
      enabled: true
  health:
    mongo:
      enabled: true

info:
  app:
    name: poker-backend
    description: Play-money poker game API
    phase: 20

app:
  operations:
    base-url: ${OPERATIONS_BASE_URL:https://operations.dpbossking.com}
    internal-key: ${OPERATIONS_INTERNAL_KEY:}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-use-32b-min-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  table:
    small-blind: ${SMALL_BLIND:10}
    big-blind: ${BIG_BLIND:20}
    starting-chips: ${STARTING_CHIPS:1000}
    max-players: ${MAX_PLAYERS:6}
    max-draw-count: ${MAX_DRAW_COUNT:5}
    turn-seconds: ${TURN_SECONDS:30}
  wallet:
    starting-balance: ${WALLET_STARTING_BALANCE:10000}
    add-cash-amount: ${WALLET_ADD_CASH_AMOUNT:1000}
    max-add-cash-amount: ${WALLET_MAX_ADD_CASH:50000}
    rake-rate: ${WALLET_RAKE_RATE:0.15}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  show-actuator: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{40} - %msg%n"
