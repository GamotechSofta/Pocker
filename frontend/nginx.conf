map $http_upgrade $poker_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=poker_auth:10m rate=10r/s;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=20s ipv6=off;
    set $game http://backend:8080;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    limit_req_status 429;

    location ^~ /api/admin { return 404; }
    location ^~ /actuator { return 404; }
    location ^~ /api/auth/ {
        limit_req zone=poker_auth burst=30 nodelay;
        proxy_pass $game;
    }
    location ^~ /api/ { proxy_pass $game; }
    location ^~ /ws {
        proxy_pass $game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $poker_connection_upgrade;
        proxy_read_timeout 75s;
    }
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
