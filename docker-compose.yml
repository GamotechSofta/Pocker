services:
  mongo:
    image: mongo:7
    container_name: poker-mongo
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: poker-backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MONGODB_URI: mongodb://mongo:27017/${MONGODB_DB:-poker}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to a unique value of at least 32 characters}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080}
    container_name: poker-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
